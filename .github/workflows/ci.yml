name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9"]
    env:
      BEARER_TOKEN: test_token_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (exclude Sense HAT)
        run: |
          python -m pip install --upgrade pip
          grep -v '^sense-hat' requirements.txt | grep -v '^#' | grep -v '^$' | xargs pip install

      - name: Run tests (script style — each file as CI invokes it)
        run: |
          for f in test_*.py; do
            [ "$f" = "test_support.py" ] && continue   # shared helper, no test cases
            echo "=== $f ==="
            python "$f" || exit 1
          done

      - name: Run tests (discover — catches files not wired to a runner)
        # Kept alongside the script-style loop above rather than instead of it: script
        # style misses tests that some files' custom main() doesn't wire up, while
        # discover alone would hide a file whose __main__ block is broken (it never
        # touches __main__ at all). Running both closes each blind spot the other has.
        run: python -m unittest discover -v -p 'test_*.py'

  docker-build:
    # Builds the actual Docker image and boots a real container from it, so a
    # regression like templates/ being missing from the image (which the unit
    # tests never touch, since they import the app directly) fails CI here
    # instead of shipping to production undetected.
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t temp-monitor:ci .

      - name: Run container
        # This runner is an x86 cloud VM with no Sense HAT, so the real
        # sense-hat package raises "Cannot detect RPi-Sense FB device" at
        # import and the server dies before it can bind a port. The mock is
        # deliberately kept OUT of the image (see Dockerfile / .dockerignore),
        # so it is bind-mounted in from the checkout instead: the image under
        # test stays byte-for-byte identical to what ships to the Pi, and the
        # stub exists only for the lifetime of this container.
        run: |
          docker run -d --name temp-monitor-ci -p 8080:8080 \
            -e BEARER_TOKEN=test_token_ci \
            -e USE_MOCK_SENSOR=1 \
            -v "${GITHUB_WORKSPACE}/mock_sense_hat.py:/app/mock_sense_hat.py:ro" \
            temp-monitor:ci

      - name: Wait for service to come up
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/health; then
              echo "Service is up after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Service never became reachable"
          docker logs temp-monitor-ci || true
          exit 1

      - name: Verify GET / returns 200 (dashboard)
        run: |
          status=$(curl -s -o /tmp/root_response.html -w "%{http_code}" http://localhost:8080/)
          echo "GET / -> ${status}"
          if [ "${status}" != "200" ]; then
            echo "Dashboard did not return 200 (got ${status}). Likely cause: templates/ missing from the image."
            cat /tmp/root_response.html
            exit 1
          fi

      - name: Verify GET /health returns 200
        run: |
          status=$(curl -s -o /tmp/health_response.json -w "%{http_code}" http://localhost:8080/health)
          echo "GET /health -> ${status}"
          if [ "${status}" != "200" ]; then
            echo "/health did not return 200 (got ${status})."
            cat /tmp/health_response.json
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker logs temp-monitor-ci || true

      - name: Cleanup
        if: always()
        run: docker rm -f temp-monitor-ci || true

  deploy:
    runs-on: self-hosted
    needs: tests
    timeout-minutes: 20
    # SECURITY: Only deploy from trusted sources (requires write access to repo)
    # - Manual trigger (workflow_dispatch) - requires write access
    # - Release published - requires write access
    # - Push to main/master - requires write access
    # NEVER runs on pull_request events (untrusted forks could execute malicious code)
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    environment:
      name: production
      url: http://raspberrypi.local:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from GitHub Secrets
        run: |
          # Validate required secrets (BEARER_TOKEN is required for API auth)
          if [ -z "${BEARER_TOKEN}" ]; then
            echo "Missing required secret: BEARER_TOKEN"
            exit 1
          fi

          # Validate CLOUDFLARED_TOKEN (required for cloudflared tunnel service)
          if [ -z "${CLOUDFLARED_TOKEN}" ]; then
            echo "Missing required secret: CLOUDFLARED_TOKEN"
            exit 1
          fi

          # Create .env file with required configuration
          echo "BEARER_TOKEN=${BEARER_TOKEN}" > .env

          # Add required Cloudflare Tunnel token
          if [ -n "${CLOUDFLARED_TOKEN}" ]; then
            echo "CLOUDFLARED_TOKEN=${CLOUDFLARED_TOKEN}" >> .env
          fi

          # Add optional Slack webhook if configured (enables alerts/status updates)
          if [ -n "${SLACK_WEBHOOK_URL}" ]; then
            echo "SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}" >> .env
            echo "WEBHOOK_ENABLED=true" >> .env
          fi

          # Production monitoring defaults (intentionally enabled for production,
          # differs from local development defaults in .env.example)
          echo "ALERT_TEMP_MIN_C=15.0" >> .env
          echo "ALERT_TEMP_MAX_C=32.0" >> .env
          echo "ALERT_HUMIDITY_MIN=20.0" >> .env
          echo "ALERT_HUMIDITY_MAX=70.0" >> .env
          echo "STATUS_UPDATE_ENABLED=true" >> .env
          echo "STATUS_UPDATE_INTERVAL=3600" >> .env
          echo "STATUS_UPDATE_ON_STARTUP=true" >> .env

          chmod 600 .env
        env:
          BEARER_TOKEN: "${{ secrets.BEARER_TOKEN }}"
          CLOUDFLARED_TOKEN: "${{ secrets.CLOUDFLARED_TOKEN }}"
          SLACK_WEBHOOK_URL: "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Ensure logs directory
        run: mkdir -p logs

      - name: Deploy with Docker Compose
        run: docker compose -p temp-monitor up -d --build --remove-orphans
